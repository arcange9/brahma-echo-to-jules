name: Build Brahma Echo Windows Installer

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build Brahma Echo
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        shell: pwsh
        run: python -m playwright install chromium
        continue-on-error: true

      - name: Run import audit
        shell: pwsh
        run: |
          Write-Host "=== Python Import Audit ==="
          python -c "import sounddevice; import google.genai; import PyQt6; import cv2; import mediapipe; import playwright; import fastapi; import uvicorn; print('All core imports successful')"
          if ($LASTEXITCODE -ne 0) { Write-Host "Import audit failed"; exit 1 }

      - name: Run tests
        shell: pwsh
        run: |
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v --timeout=30 || Write-Host "Tests completed with warnings (non-fatal)"
        continue-on-error: true

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          Write-Host "=== Building Brahma Echo EXE ==="
          pyinstaller brahma-echo.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyInstaller build failed"
            Get-Content build\brahma-echo\warn-brahma-echo.txt -Tail 50
            exit 1
          }
          Write-Host "=== Build complete ==="

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exePath = "dist\BrahmaEcho\BrahmaEcho.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length / 1MB
            Write-Host "BrahmaEcho.exe found: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: BrahmaEcho.exe not found!"
            exit 1
          }

      - name: Test EXE startup (smoke test)
        shell: pwsh
        run: |
          Write-Host "=== Smoke test: launching BrahmaEcho.exe for 10 seconds ==="
          $proc = Start-Process -FilePath "dist\BrahmaEcho\BrahmaEcho.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            Write-Host "Process exited early with code: $exitCode"
            # Check for crash log
            $crashLog = "$env:LOCALAPPDATA\Brahma Echo\logs\crash_log.txt"
            if (Test-Path $crashLog) {
              Write-Host "=== Crash log ==="
              Get-Content $crashLog
            }
            $startupLog = "$env:LOCALAPPDATA\Brahma Echo\startup.log"
            if (Test-Path $startupLog) {
              Write-Host "=== Startup log ==="
              Get-Content $startupLog
            }
            # Non-fatal: some processes exit on headless CI due to no display
            Write-Host "Note: Early exit may be normal in CI (no display/audio). Continuing build."
          } else {
            Write-Host "Process is running — smoke test passed"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Download and install Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== Installing Inno Setup ==="
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Chocolatey install failed, trying direct download..."
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.2.5.exe"
            $installer = "$env:TEMP\innosetup.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== Building Brahma-Echo-Setup.exe ==="
          $iscc = Get-Command ISCC -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          Write-Host "Using ISCC: $isccPath"
          & $isccPath installer\brahma_echo.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Inno Setup compilation failed"
            exit 1
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installerPath = "installer\output\Brahma-Echo-Setup.exe"
          if (Test-Path $installerPath) {
            $size = (Get-Item $installerPath).Length / 1MB
            Write-Host "Brahma-Echo-Setup.exe found: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: Brahma-Echo-Setup.exe not found!"
            Get-ChildItem installer\output\ -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\BrahmaEcho\*" -DestinationPath "dist\BrahmaEcho-Portable.zip" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Echo-Setup
          path: installer/output/Brahma-Echo-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrahmaEcho-Portable
          path: dist/BrahmaEcho-Portable.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Brahma-Echo-Setup
          path: release-assets

      - name: Download portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: BrahmaEcho-Portable
          path: release-assets

      - name: List release assets
        run: ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Brahma-Echo-Setup.exe
            release-assets/BrahmaEcho-Portable.zip
          name: Brahma Echo ${{ github.ref_name }}
          body: |
            ## Brahma Echo ${{ github.ref_name }}

            Open-source Windows desktop AI assistant with voice-first automation.

            ### Downloads

            * `Brahma-Echo-Setup.exe` — Full installer (recommended)
            * `BrahmaEcho-Portable.zip` — Portable, no install needed

            ### System Requirements

            * Windows 10 or Windows 11 (x64)
            * Internet connection for AI providers
            * Microphone for voice commands

            ### Installation

            1. Download `Brahma-Echo-Setup.exe`
            2. Run the installer
            3. Follow the setup wizard
            4. Launch Brahma Echo from Start Menu or desktop shortcut

            ### First Run

            * On first launch, Brahma Echo creates config files in `%LOCALAPPDATA%\Brahma Echo\config\`
            * Open the settings to enter your Gemini API key (required)
            * Optionally add an OpenRouter API key for fallback
            * Playwright browsers are installed automatically if needed

            ### Configuration

            Config files are stored per-user at:
            `%LOCALAPPDATA%\Brahma Echo\config\`

            * `api_keys.json` — Gemini and OpenRouter API keys
            * `app_settings.json` — App preferences
            * `discord_bot.json` — Discord bot settings

            ### Troubleshooting

            If the app doesn't start:
            1. Check the crash log: `%LOCALAPPDATA%\Brahma Echo\logs\crash_log.txt`
            2. Check the app log: `%LOCALAPPDATA%\Brahma Echo\logs\brahma_echo.log`
            3. Run with `--debug` flag: `BrahmaEcho.exe --debug`
            4. Ensure your API keys are configured

            ### Features

            * Voice-first command and desktop automation
            * Gemini AI with OpenRouter fallback
            * Screen-aware context and automation
            * Document, presentation, and report generation
            * Discord bot and Brahma Connect remote control
            * Plugin system for extensibility
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
