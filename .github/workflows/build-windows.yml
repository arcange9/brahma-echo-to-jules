name: Build Brahma Echo Windows Installer

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Brahma Echo
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        shell: pwsh
        run: python -m playwright install chromium
        continue-on-error: true

      - name: Run import audit
        shell: pwsh
        run: |
          Write-Host "=== Python Import Audit ==="
          python -c "import sounddevice; import google.genai; import PyQt6; import cv2; import mediapipe; import playwright; import fastapi; import uvicorn; print('All core imports successful')"
          if ($LASTEXITCODE -ne 0) { Write-Host "Import audit failed"; exit 1 }
          Write-Host ""
          Write-Host "=== Extended Import Audit ==="
          python -c "import pyautogui; import pywinauto; import mss; import psutil; import comtypes; import pycaw; import edge_tts; import reportlab; import openpyxl; import pptx; import docx; import discord; import cryptography; import qrcode; import bs4; import send2trash; import youtube_transcript_api; import duckduckgo_search; print('All extended imports successful')"
          if ($LASTEXITCODE -ne 0) { Write-Host "Extended import audit failed"; exit 1 }

      - name: Run tests
        shell: pwsh
        run: |
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v --timeout=30 || Write-Host "Tests completed with warnings (non-fatal)"
        continue-on-error: true

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          Write-Host "=== Building Brahma Echo EXE ==="
          pyinstaller brahma-echo.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) {
            Write-Host "PyInstaller build failed"
            if (Test-Path "build\brahma-echo\warn-brahma-echo.txt") {
              Get-Content build\brahma-echo\warn-brahma-echo.txt -Tail 50
            }
            exit 1
          }
          Write-Host "=== Build complete ==="

      - name: Build Debug EXE with PyInstaller
        shell: pwsh
        run: |
          Write-Host "=== Building Brahma Echo Debug EXE ==="
          pyinstaller brahma-echo-debug.spec --noconfirm --clean
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Debug build failed (non-fatal)"
          } else {
            Write-Host "=== Debug build complete ==="
          }
        continue-on-error: true

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exePath = "dist\BrahmaEcho\BrahmaEcho.exe"
          if (Test-Path $exePath) {
            $size = (Get-Item $exePath).Length / 1MB
            Write-Host "BrahmaEcho.exe found: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: BrahmaEcho.exe not found!"
            exit 1
          }

      - name: Test EXE startup (smoke test)
        shell: pwsh
        run: |
          Write-Host "=== Smoke test: launching BrahmaEcho.exe for 10 seconds ==="
          $proc = Start-Process -FilePath "dist\BrahmaEcho\BrahmaEcho.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            $exitCode = $proc.ExitCode
            Write-Host "Process exited early with code: $exitCode"
            $crashLog = "$env:LOCALAPPDATA\Brahma Echo\logs\crash_log.txt"
            if (Test-Path $crashLog) {
              Write-Host "=== Crash log ==="
              Get-Content $crashLog
            }
            $startupLog = "$env:LOCALAPPDATA\Brahma Echo\startup.log"
            if (Test-Path $startupLog) {
              Write-Host "=== Startup log ==="
              Get-Content $startupLog
            }
            Write-Host "Note: Early exit may be normal in CI (no display/audio). Continuing build."
          } else {
            Write-Host "Process is running — smoke test passed"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Download and install Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== Installing Inno Setup ==="
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Chocolatey install failed, trying direct download..."
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.2.5.exe"
            $installer = "$env:TEMP\innosetup.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "=== Building Brahma-Echo-Setup.exe ==="
          $iscc = Get-Command ISCC -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          Write-Host "Using ISCC: $isccPath"
          & $isccPath installer\brahma_echo.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Inno Setup compilation failed"
            exit 1
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installerPath = "installer\output\Brahma-Echo-Setup.exe"
          if (Test-Path $installerPath) {
            $size = (Get-Item $installerPath).Length / 1MB
            Write-Host "Brahma-Echo-Setup.exe found: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "ERROR: Brahma-Echo-Setup.exe not found!"
            Get-ChildItem installer\output\ -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brahma-Echo-Setup
          path: installer/output/Brahma-Echo-Setup.exe
          retention-days: 90

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrahmaEcho-Portable
          path: dist/BrahmaEcho/
          retention-days: 90

      - name: Upload debug build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrahmaEcho-Debug
          path: dist/BrahmaEchoDebug/
          retention-days: 30
        if: always()

      - name: Create or update GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=== Creating GitHub Release ==="
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          # Try to create the release; if it already exists, just upload the asset
          $releaseExists = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating new release for $tag"
            gh release create $tag `
              --title "Brahma Echo $tag" `
              --notes "Download Brahma-Echo-Setup.exe to install Brahma Echo on Windows 10/11. See the README for installation instructions." `
              --repo $env:GITHUB_REPOSITORY
          } else {
            Write-Host "Release $tag already exists, uploading asset"
          }
          # Upload the installer (use --clobber to overwrite if it exists)
          gh release upload $tag installer/output/Brahma-Echo-Setup.exe --clobber --repo $env:GITHUB_REPOSITORY

      - name: Clean up build intermediates
        shell: pwsh
        run: |
          Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
